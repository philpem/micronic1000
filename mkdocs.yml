site_name: Micronic 1000 Programmer Manual
site_description: Programmer-facing and internal documentation for DIPOS-B
site_url: https://philpem.github.io/micronic1000/
docs_dir: doc
site_dir: site-mkdocs
theme:
  name: material
  language: en
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
plugins:
  - search
  - redirects:
      redirect_maps:
        'manual/bdos-reference.md': 'reference/bdos.md'
        'manual/barcode-reader.md': 'reference/barcode.md'
        'manual/program-formats.md': 'reference/program-formats.md'
        'internals/memory-map.md': 'reference/memory-map.md'
        'reference/memory-io.md': 'reference/memory-map.md'
        'internals/io-map.md': 'reference/memory-map.md'
        'internals/os-diposb.md': 're-notes/os-diposb.md'
        'internals/forms-ui.md': 're-notes/forms-ui.md'
        'internals/cp-m-comparison.md': 're-notes/cp-m-comparison.md'
        'internals/interrupts.md': 're-notes/interrupts.md'
        'internals/rtc.md': 're-notes/rtc.md'
validation:
  links:
    anchors: warn
extra_javascript:
  # Custom fences below provide the DOM shape expected by these renderers.
  # Keep this order: WaveDrom's default skin creates window.WaveSkin.
  - https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js
  - https://cdn.jsdelivr.net/npm/wavedrom@3.6.2/skins/default.js
  - https://cdn.jsdelivr.net/npm/wavedrom@3.6.2/wavedrom.min.js
  - javascripts/diagrams.js
extra_css:
  - stylesheets/diagrams.css
exclude_docs: |
  review.md
  node_modules/**
  BUILD.md
  Makefile
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
        - name: wavedrom
          class: wavedrom
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
nav:
  - Home: README.md
  - Programmer manual:
      - manual/README.md
      - User guide: manual/user-guide.md
      - Supported application profile: manual/supported-profile.md
      - First COM program: manual/first-program.md
      - Programmer guide: manual/programmer-guide.md
      - Devices and storage: manual/devices-and-storage.md
  - API and ABI reference:
      - reference/README.md
      - BDOS calls: reference/bdos.md
      - DIPOS-B extensions: reference/extensions.md
      - Barcode reader: reference/barcode.md
      - Program file formats: reference/program-formats.md
      - Commstar application API: reference/commstar-api.md
      - Commstar peer library: reference/commstar-peer.md
      - Memory and I/O map: reference/memory-map.md
      - Keyboard: reference/keyboard.md
  - Protocol reference:
      - protocol/README.md
      - Commstar transport: protocol/commstar.md
  - Reverse-engineering notes:
      - re-notes/README.md
      - Method and evidence rules: re-notes/method.md
      - Commstar evidence and traces: re-notes/commstar-evidence.md
      - Commstar API evidence: re-notes/commstar-api-evidence.md
      - InlineTableDispatch tables: re-notes/inline-dispatch.md
      - Listing-repair script: re-notes/ghidra-repair-script.md
      - OS internals: re-notes/os-diposb.md
      - Monitor / ICE hook: re-notes/monitor-and-debug.md
      - Forms and UI: re-notes/forms-ui.md
      - CP/M comparison: re-notes/cp-m-comparison.md
      - Interrupts: re-notes/interrupts.md
      - Unbanked RAM map: re-notes/unbanked-ram-map.md
      - Memory and I/O evidence: re-notes/memory-and-io-evidence.md
      - Barcode capture: re-notes/barcode-capture.md
      - RTC: re-notes/rtc.md
      - IR wire protocol: re-notes/ir-wire-protocol.md
      - ROM exerciser test plan: re-notes/exerciser-test-plan.md
      - Connector experiment: re-notes/connector-experiment.md
      - IR feedback harness interface: re-notes/ir-feedback-protocol.md
      - Stock-context v3 bench round: re-notes/stock-context-v3-round1.md
      - Stock-context v3 content round: re-notes/stock-context-v3-round2.md
      - Stock-context v4 handover: re-notes/stock-context-v4-handover.md
      - IR feedback automation plan: re-notes/ir-feedback-test-plan.md
      - Open questions: re-notes/open-questions.md
      - Research archive:
          - research/README.md
          - Worklist: research/TASKS.md
          - Session log: research/session-log.md
          - Coverage tracker: research/gap-analysis.md
          - Coverage pass history: research/gap-analysis-history.md
          - IR instrumentation audit: research/reviews/ir-protocol-audit-2026-09-22.md
          - Feedback-v3 and Uno real-time audit: research/reviews/feedback-v3-audit-2026-09-23.md
          - IR bench rounds and planned-ROM review: research/reviews/ir-rounds-review-2026-09-23.md
          - Barcode OS-integration review: research/reviews/barcode-os-integration.md
          - Quality and agents review: research/reviews/quality-and-agents.md
