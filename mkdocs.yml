site_name: Micronic 1000 Programmer Manual
site_description: Programmer-facing and internal documentation for DIPOS-B
site_url: https://philpem.github.io/micronic1000/
docs_dir: doc
site_dir: site-mkdocs
theme:
  name: material
  language: en
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
plugins:
  - search
extra_javascript:
  # Custom fences below provide the DOM shape expected by these renderers.
  # Keep this order: WaveDrom's default skin creates window.WaveSkin.
  - https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js
  - https://cdn.jsdelivr.net/npm/wavedrom@3.6.2/skins/default.js
  - https://cdn.jsdelivr.net/npm/wavedrom@3.6.2/wavedrom.min.js
  - javascripts/diagrams.js
exclude_docs: |
  research/**
  review.md
  node_modules/**
  BUILD.md
  Makefile
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
        - name: wavedrom
          class: wavedrom
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
nav:
  - Home: README.md
  - Programmer manual:
      - manual/README.md
      - User guide: manual/user-guide.md
      - Programmer guide: manual/programmer-guide.md
      - BDOS reference: manual/bdos-reference.md
      - Devices and storage: manual/devices-and-storage.md
      - Barcode reader: manual/barcode-reader.md
      - Program formats: manual/program-formats.md
  - Protocol:
      - protocol/README.md
      - Commstar: protocol/commstar.md
  - OS and hardware internals:
      - internals/README.md
      - Memory map: internals/memory-map.md
      - I/O map: internals/io-map.md
      - Interrupts: internals/interrupts.md
      - DIPOS-B OS: internals/os-diposb.md
      - Forms and UI: internals/forms-ui.md
      - CP/M comparison: internals/cp-m-comparison.md
      - RTC: internals/rtc.md
